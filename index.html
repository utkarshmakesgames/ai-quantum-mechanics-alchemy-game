<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universe Timeline — Quantum Physics Journey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ TITLE SCREEN ============ -->
  <div id="screen-title" class="screen active">
    <div class="title-container">
      <div class="title-stars"></div>
      <h1 class="title-text">
        <span class="title-universe">Universe</span>
        <span class="title-timeline">Timeline</span>
      </h1>
      <p class="title-subtitle">Guide the universe from the Big Bang to modern physics</p>

      <div class="title-modes">
        <button id="btn-story" class="mode-btn story-btn">
          <span class="mode-icon">🌌</span>
          <span class="mode-name">Story Mode</span>
          <span class="mode-desc">Experience the universe's evolution</span>
        </button>
        <button id="btn-sandbox" class="mode-btn sandbox-btn">
          <span class="mode-icon">⚗️</span>
          <span class="mode-name">Sandbox</span>
          <span class="mode-desc">Free alchemy with discovered elements</span>
        </button>
      </div>

      <div id="sandbox-hint" class="sandbox-hint" style="display:none">
        Complete Story Mode eras to unlock elements for Sandbox!
      </div>
    </div>
  </div>

  <!-- ============ STORY MODE ============ -->
  <div id="screen-story" class="screen">
    <div class="story-layout">

      <!-- Top bar -->
      <header class="story-header">
        <button class="btn-back-title btn-icon" title="Back to menu">← Menu</button>
        <div class="header-center">
          <h2 id="era-title">Era 1: Quark Epoch</h2>
          <span id="era-time" class="era-time">10⁻¹² s after the Big Bang</span>
        </div>
        <div class="header-right">
          <button class="btn-mute btn-icon">🔊</button>
        </div>
      </header>

      <!-- Era navigation -->
      <div class="era-nav">
        <button id="btn-prev-era" class="btn-era-nav" disabled>← Prev</button>
        <div id="era-map" class="era-map"></div>
        <button id="btn-next-era" class="btn-era-nav">Next →</button>
      </div>

      <!-- Main content -->
      <div class="story-content">

        <!-- Left: Particle canvas (dials mode) or question context -->
        <div class="story-left">
          <p id="era-description" class="era-desc"></p>
          <canvas id="particle-canvas" class="particle-canvas"></canvas>
        </div>

        <!-- Right: Controls & discoveries -->
        <div class="story-right">

          <!-- DIAL PANEL -->
          <div id="dial-panel" class="panel" style="display:none">
            <h3 class="panel-title">Adjust Conditions</h3>
            <div id="dial-sliders" class="dial-sliders"></div>
            <div id="dial-hint" class="dial-hint" style="display:none"></div>
          </div>

          <!-- CHOICE PANEL -->
          <div id="choice-panel" class="panel" style="display:none">
            <div id="choice-content" class="choice-content"></div>
            <div id="choice-feedback" class="choice-feedback" style="display:none"></div>
          </div>

          <!-- DISCOVERIES -->
          <div class="discoveries-panel">
            <h3 class="panel-title">Discoveries</h3>
            <div id="era-discoveries" class="discovery-list"></div>
          </div>
        </div>
      </div>

      <!-- Discovery popup -->
      <div id="discovery-popup" class="discovery-popup"></div>

      <!-- Era complete banner -->
      <div id="era-complete-banner" class="era-complete-banner" style="display:none">
        <span class="era-complete-text"></span>
      </div>
    </div>
  </div>

  <!-- ============ SANDBOX MODE ============ -->
  <div id="screen-sandbox" class="screen">
    <div class="sandbox-layout">

      <header class="sandbox-header">
        <button class="btn-back-title btn-icon">← Menu</button>
        <h2>Sandbox Forge</h2>
        <div class="header-right">
          <span id="sandbox-stats" class="sandbox-stats"></span>
          <button class="btn-mute btn-icon">🔊</button>
        </div>
      </header>

      <div class="sandbox-content">
        <!-- Forge -->
        <div class="sandbox-forge">
          <div class="forge-slots">
            <div id="sandbox-slot1" class="sandbox-slot empty active">
              <span class="slot-empty">?</span>
            </div>
            <span class="forge-plus">+</span>
            <div id="sandbox-slot2" class="sandbox-slot empty">
              <span class="slot-empty">?</span>
            </div>
            <span id="sandbox-slot3-group" class="forge-plus" style="display:none">
              + <div id="sandbox-slot3" class="sandbox-slot empty">
                <span class="slot-empty">?</span>
              </div>
            </span>
          </div>

          <div class="forge-actions">
            <button id="sandbox-combine" class="btn-combine" disabled>Combine</button>
            <button id="sandbox-clear" class="btn-clear">Clear</button>
            <button id="sandbox-toggle-slots" class="btn-toggle">3-Slot</button>
          </div>

          <div id="sandbox-preview" class="sandbox-preview"></div>
          <div id="sandbox-result" class="sandbox-result" style="display:none"></div>
        </div>

        <!-- Element grid -->
        <div class="sandbox-elements">
          <input id="sandbox-search" type="text" placeholder="Search elements..." class="sandbox-search">
          <span id="sandbox-count" class="sandbox-count"></span>
          <div id="sandbox-grid" class="sandbox-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data/elements.js"></script>
  <script src="js/data/recipes.js"></script>
  <script src="js/data/eras.js"></script>
  <script src="js/data/journal.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/sandbox.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
